<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namaz Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .table-container { background: white; border-radius: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); border: 1px solid #e2e8f0; }
        .btn-yes { background-color: #10b981; color: white; box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3); }
        .btn-no { background-color: #ef4444; color: white; box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2); }
        .btn-none { background-color: #e2e8f0; color: #64748b; }
        th { font-size: 0.9rem !important; text-transform: uppercase; letter-spacing: 0.05em; color: #0f172a !important; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Header -->
    <nav class="bg-white border-b border-slate-200 px-4 py-4 mb-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tight">Namaz Tracker</h1>
            </div>
            <button id="authBtn" onclick="handleAuth()" class="bg-slate-900 text-white px-5 py-2 rounded-xl font-bold hover:bg-slate-800 transition shadow-md">
                Login
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4">
        
        <!-- Top Section: Time & Prayer API -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <!-- Clock Card -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 text-center">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Live Clock</span>
                <h2 id="liveClock" class="text-4xl font-black text-slate-900 my-2">00:00:00</h2>
                <div class="inline-flex bg-slate-100 p-1 rounded-xl">
                    <button onclick="setClockFormat(12)" id="btn12h" class="px-4 py-1.5 text-sm font-bold rounded-lg transition">12H</button>
                    <button onclick="setClockFormat(24)" id="btn24h" class="px-4 py-1.5 text-sm font-bold rounded-lg transition">24H</button>
                </div>
            </div>

            <!-- Prayer Times Card -->
            <div class="md:col-span-2 bg-emerald-900 p-6 rounded-3xl shadow-xl text-white">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        </svg>
                        Today's Prayer Times
                    </h3>
                    <button onclick="fetchPrayerTimes()" class="text-[10px] bg-emerald-800 hover:bg-emerald-700 px-3 py-1 rounded-full uppercase font-bold transition">Update Location</button>
                </div>
                <div id="prayerTimesGrid" class="grid grid-cols-5 gap-3">
                    <!-- Default State -->
                    <div class="col-span-5 text-center py-4 text-emerald-300 text-sm">Allow location access to see times...</div>
                </div>
            </div>
        </div>

        <!-- Filter / History Selector -->
        <div class="flex items-center justify-between mb-6 px-2">
            <h2 class="text-xl font-extrabold text-slate-900">Tracking History</h2>
            <div class="flex gap-2">
                <select id="monthSelect" class="bg-white border border-slate-200 rounded-xl px-4 py-2 font-bold text-slate-700 shadow-sm focus:ring-2 ring-emerald-500 outline-none"></select>
                <select id="yearSelect" class="bg-white border border-slate-200 rounded-xl px-4 py-2 font-bold text-slate-700 shadow-sm focus:ring-2 ring-emerald-500 outline-none"></select>
            </div>
        </div>

        <!-- Main Tracking Table -->
        <div class="table-container overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="px-6 py-5">Date</th>
                            <th class="px-4 py-5 text-center">Fajr</th>
                            <th class="px-4 py-5 text-center">Dhuhr</th>
                            <th class="px-4 py-5 text-center">Asr</th>
                            <th class="px-4 py-5 text-center">Maghrib</th>
                            <th class="px-4 py-5 text-center">Isha</th>
                        </tr>
                    </thead>
                    <tbody id="trackerBody" class="divide-y divide-slate-100">
                        <!-- Content loaded by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal: Auth -->
    <div id="authModal" class="fixed inset-0 bg-slate-900/80 hidden items-center justify-center z-50 backdrop-blur-md p-4">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl max-w-md w-full border border-slate-100">
            <h2 class="text-3xl font-black mb-2 text-slate-900">Welcome</h2>
            <p class="text-slate-500 mb-8 font-medium">Track your progress and save it forever.</p>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="Email Address" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-emerald-500 focus:bg-white outline-none transition">
                <input type="password" id="password" placeholder="Password" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-emerald-500 focus:bg-white outline-none transition">
                <div class="flex gap-3 pt-2">
                    <button onclick="submitAuth('login')" class="flex-1 bg-emerald-600 text-white py-4 rounded-2xl font-black hover:bg-emerald-700 shadow-lg shadow-emerald-200 transition">Login</button>
                    <button onclick="submitAuth('signup')" class="flex-1 bg-slate-100 text-slate-600 py-4 rounded-2xl font-black hover:bg-slate-200 transition">Sign Up</button>
                </div>
            </div>
            <button onclick="authModal.classList.add('hidden')" class="w-full mt-6 text-slate-400 font-bold text-sm uppercase tracking-widest">Go Back</button>
        </div>
    </div>

    <!-- Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- PASTE YOUR FIREBASE CONFIG HERE ---
        const firebaseConfig = {
            // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAsiS7he75F1tVdfvVt3vapLltywAgyHMg",
  authDomain: "namaz-tracker-7a4af.firebaseapp.com",
  projectId: "namaz-tracker-7a4af",
  storageBucket: "namaz-tracker-7a4af.firebasestorage.app",
  messagingSenderId: "1044195980767",
  appId: "1:1044195980767:web:6a467fa31b12b6148b806a",
  measurementId: "G-5S3NKJ60XR"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let clockFormat = 12;
        const prayers = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];

        // --- 1. CLOCK (Bold & Large) ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const min = String(now.getMinutes()).padStart(2, '0');
            const sec = String(now.getSeconds()).padStart(2, '0');
            let ampm = '';

            if (clockFormat === 12) {
                ampm = hours >= 12 ? ' PM' : ' AM';
                hours = hours % 12 || 12;
            }
            document.getElementById('liveClock').innerText = `${String(hours).padStart(2, '0')}:${min}:${sec}${ampm}`;
        }
        setInterval(updateClock, 1000);

        window.setClockFormat = async (fmt) => {
            clockFormat = fmt;
            document.getElementById('btn12h').className = fmt === 12 ? 'px-4 py-1.5 text-sm font-bold rounded-lg bg-white shadow text-emerald-600' : 'px-4 py-1.5 text-sm font-bold text-slate-400';
            document.getElementById('btn24h').className = fmt === 24 ? 'px-4 py-1.5 text-sm font-bold rounded-lg bg-white shadow text-emerald-600' : 'px-4 py-1.5 text-sm font-bold text-slate-400';
            if (currentUser) await setDoc(doc(db, "users", currentUser.uid), { clockFormat: fmt }, { merge: true });
        };

        // --- 2. PRAYER TIMES (Fixed Logic) ---
        window.fetchPrayerTimes = () => {
            const grid = document.getElementById('prayerTimesGrid');
            grid.innerHTML = `<div class="col-span-5 text-center text-emerald-300">Finding your location...</div>`;

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const { latitude, longitude } = pos.coords;
                try {
                    const resp = await fetch(`https://api.aladhan.com/v1/timings?latitude=${latitude}&longitude=${longitude}&method=2`);
                    const data = await resp.json();
                    const t = data.data.timings;
                    
                    grid.innerHTML = '';
                    prayers.forEach(p => {
                        grid.innerHTML += `
                        <div class="bg-emerald-800/50 p-3 rounded-2xl text-center border border-emerald-700">
                            <p class="text-[10px] font-bold text-emerald-400 uppercase tracking-tighter">${p}</p>
                            <p class="text-base font-black text-white">${t[p]}</p>
                        </div>`;
                    });
                } catch (e) { grid.innerHTML = `<div class="col-span-5 text-red-300 text-xs">Failed to load timings. Try refreshing.</div>`; }
            }, (err) => {
                grid.innerHTML = `<div class="col-span-5 text-emerald-300 text-xs">Location Access Denied. Please enable GPS.</div>`;
            });
        };

        // --- 3. TRACKER LOGIC (High Contrast) ---
        async function renderTracker() {
            if (!currentUser) {
                document.getElementById('trackerBody').innerHTML = `<tr><td colspan="6" class="p-20 text-center text-slate-400 font-bold uppercase tracking-widest text-sm">Please login to track prayers</td></tr>`;
                return;
            }
            
            const month = parseInt(document.getElementById('monthSelect').value);
            const year = parseInt(document.getElementById('yearSelect').value);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            const docSnap = await getDoc(doc(db, "users", currentUser.uid, "months", `${year}-${month}`));
            const monthData = docSnap.exists() ? docSnap.data() : {};

            let html = '';
            for (let day = 1; day <= daysInMonth; day++) {
                html += `<tr class="hover:bg-slate-50 transition">
                    <td class="px-6 py-4 font-black text-slate-800 border-r border-slate-50">${day} ${document.getElementById('monthSelect').options[month].text.substring(0,3)}</td>`;
                
                prayers.forEach(prayer => {
                    const status = (monthData[day] && monthData[day][prayer]);
                    let btnStyle = 'btn-none';
                    let label = '—';
                    
                    if (status === true) { btnStyle = 'btn-yes'; label = 'YES'; }
                    else if (status === false) { btnStyle = 'btn-no'; label = 'NO'; }

                    html += `
                        <td class="px-2 py-3 text-center">
                            <button onclick="togglePrayer('${year}-${month}', ${day}, '${prayer}', ${status})" 
                                class="w-14 h-9 rounded-xl text-[10px] font-black transition-all transform active:scale-95 ${btnStyle}">
                                ${label}
                            </button>
                        </td>`;
                });
                html += `</tr>`;
            }
            document.getElementById('trackerBody').innerHTML = html;
        }

        window.togglePrayer = async (monthKey, day, prayer, currentStatus) => {
            // Cycle: undefined -> true (Yes) -> false (No) -> true...
            const nextStatus = currentStatus === true ? false : true;
            await setDoc(doc(db, "users", currentUser.uid, "months", monthKey), { [day]: { [prayer]: nextStatus } }, { merge: true });
            renderTracker();
        };

        // --- 4. AUTH ---
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            const btn = document.getElementById('authBtn');
            if (user) {
                btn.innerText = "Logout";
                const snap = await getDoc(doc(db, "users", user.uid));
                setClockFormat(snap.exists() ? (snap.data().clockFormat || 12) : 12);
                renderTracker();
            } else {
                btn.innerText = "Login";
                renderTracker();
            }
        });

        window.handleAuth = () => {
            if (currentUser) signOut(auth).then(() => location.reload());
            else document.getElementById('authModal').classList.replace('hidden', 'flex');
        };

        window.submitAuth = async (mode) => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                if (mode === 'login') await signInWithEmailAndPassword(auth, email, pass);
                else await createUserWithEmailAndPassword(auth, email, pass);
                document.getElementById('authModal').classList.replace('flex', 'hidden');
            } catch (err) { alert(err.message); }
        };

        // INIT
        const mS = document.getElementById('monthSelect');
        const yS = document.getElementById('yearSelect');
        ["January","February","March","April","May","June","July","August","September","October","November","December"].forEach((m,i) => mS.innerHTML+=`<option value="${i}">${m}</option>`);
        for(let y=2024; y<=2030; y++) yS.innerHTML+=`<option value="${y}">${y}</option>`;
        
        const d = new Date();
        mS.value = d.getMonth(); yS.value = d.getFullYear();
        mS.onchange = renderTracker; yS.onchange = renderTracker;

        updateClock();
        fetchPrayerTimes();
    </script>
</body>
</html>
